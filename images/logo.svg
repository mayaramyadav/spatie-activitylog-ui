<svg xmlns="http://www.w3.org/2000/svg" width="220" height="48" viewBox="0 0 220 48" role="img" aria-labelledby="title">
  <title id="title">ActivityLog UI</title>
  <defs>
    <linearGradient id="iconGradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- ActivityLog icon -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#iconGradient)"/>

  <!-- Timeline -->
  <path d="M15 11v26" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="15" cy="13" r="3.3" fill="#fff"/>
  <circle cx="15" cy="24" r="3.3" fill="#fff"/>
  <circle cx="15" cy="35" r="3.3" fill="#fff"/>

  <!-- Activity pulse -->
  <path d="M21 31h5l3-7 4 9 5-15 4 7"
        fill="none" stroke="#fff" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="56" y="31"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="21" font-weight="600" letter-spacing="-0.4"
        fill="#0F172A" stroke="#fff" stroke-width="1.2" paint-order="stroke">ActivityLog</text>
  <text x="166" y="31"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="21" font-weight="500" letter-spacing="-0.4"
        fill="#3B82F6" stroke="#fff" stroke-width="1.2" paint-order="stroke">UI</text>
</svg>